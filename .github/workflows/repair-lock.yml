name: Repair Taskivities lockfile (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-lock.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify and commit changed lockfile
        shell: bash
        run: |
          git diff -- package-lock.json | head -n 45
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(deps): synchronize taskivities lockfile"
            git push origin HEAD:main
          fi
