<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0E13" />
    <!-- Light / dark theme before anything draws (same rule as src/theme.ts), so there's no flash. -->
    <script>var t;try{t=localStorage.getItem('tv:theme')}catch(e){}if(t!=='light'&&!(t==='system'&&!matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark'</script>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <!-- Installing to a phone's home screen: manifest + icons (served by the Worker; admins can upload a PNG icon). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Taskivities" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Taskivities</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
